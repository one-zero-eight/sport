name: sport

services:
  nginx:
    # See more: https://hub.docker.com/_/nginx
    image: "nginx:1.31"
    restart: no
    ports:
      - "80:80"
    depends_on:
      - app
    volumes:
      - "./deploy/nginx-conf/dev.conf:/etc/nginx/conf.d/default.conf:ro"
      - "./deploy/nginx-logs:/var/log/nginx"
      - "django-static:/static"
      - "uploaded_media:/media:ro"

  app:
    build: .
    # Run development server with hot reload
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload
    pre_start:
      - command: ["python3", "manage.py", "collectstatic", "--noinput"]
      - command: ["python3", "manage.py", "migrate"]
      - command: ["python3", "manage.py", "createcachetable"]
    restart: no
    volumes:
      - ".:/app"
      - "django-auth-preserve:/opt/venv/lib/python3.12/site-packages/django/contrib/auth/migrations/"
      - "django-static:/static"
      - "uploaded_media:/uploaded_media"
    ports:
     - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Defaults from .env.example; optional .env overrides (SSO secrets, etc.)
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      DEBUG: "true"

  cron:
    build: .
    command: supercronic /deploy/crontab
    healthcheck:
      test: ["NONE"]
    restart: no
    volumes:
      - ".:/app"
      - "./deploy/crontab:/deploy/crontab:ro"
      - "django-auth-preserve:/opt/venv/lib/python3.12/site-packages/django/contrib/auth/migrations/"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      TZ: "Europe/Moscow"

  db:
    # See more: https://hub.docker.com/_/postgres
    image: "postgres:17.1-alpine"
    restart: no
    ports:
      - "5432:5432"
    volumes:
      - "db-data:/var/lib/postgresql/data"
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

volumes:
  db-data:
  django-static:
  # required to preserve change to django.contrib.auth.models.Group class.
  # (verbose_name added)
  # since Innopolis adfs provides groupsid as universal identifier
  # (group - can be either in Russian or English)
  django-auth-preserve:
  uploaded_media:
