[project]
name = "sport"
version = "0.1.0"
description = ""
authors = [{ name = "one_zero_eight" }]
urls = { homepage = "https://t.me/one_zero_eight" }
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.12.3,<5",
    "django==5.2.14",
    "django-admin-autocomplete-filter>=0.7.1,<0.8",
    "django-admin-rangefilter>=0.13.2,<0.14",
    "django-auth-adfs>=1.14.0,<2",
    "django-cors-headers>=4.7.0,<5",
    "django-hijack>=3.7.0,<4",
    "django-image-optimizer>=1.0.3,<2",
    "django-import-export>=4.3.1,<5",
    "django-pglock>=1.7.1,<2",
    "django-prometheus>=2.3.1,<3",
    "django-revproxy>=0.13.0,<0.14",
    "django-sendfile2>=0.7.1,<0.8",
    "django-smartfields",
    "django-stubs==5.2.9",
    "django-tinymce>=4.1.0,<5",
    "djangorestframework-stubs>=3.16.8,<4",
    "drf-spectacular[sidecar]>=0.28.0,<0.29",
    "openpyxl>=3.1.5,<4",
    "pillow>=12.2.0,<13",
    "psycopg[binary, pool]>=3.2.9,<4",
    "pyjwt==2.4.0",
    "pytest>=8.3.3,<9",
    "pytest-django>=4.9.0,<5",
    "pytest-freezegun",
    "pytz>=2025.1,<2026",
    "requests>=2.32.3,<3",
    "urllib3>=2.7.0",
    "sentry-sdk>=2.19.0,<3",
    "typing-extensions>=4.12.2,<5",
    "uvicorn>=0.32.1,<0.33",
    "django-stubs-ext==5.2.9",
    "fastapi>=0.133.0,<0.134",
    "a2wsgi>=1.10.10,<2",
    "python-multipart>=0.0.22,<0.0.23",
    "fastapi-swagger>=0.4.44,<0.5",
]

[dependency-groups]
dev = [
    "prek>=0.5.5",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.uv.sources]
django-smartfields = { git = "https://github.com/ViniciusBernardo/django-smartfields.git", branch = "master" }
pytest-freezegun = { git = "https://github.com/oizik/pytest-freezegun.git", branch = "master" }

[tool.ruff]
extend-exclude = [".agents/skills", "sport/static/third-party"]
line-length = 120
lint.preview = true
lint.extend-select = [
    "E", # pycodestyle error
    "I", # isort
    "N", # pep-8 naming
    "S", # bandit
    "UP", # pyupgrade
    "PL", # pylint
    "A", # flake8-builtins
    "DTZ", # flake8-datetimez
    "ICN", # flake8-import-conventions
    "TID251", # flake8-tidy-imports banned-api
]
lint.extend-ignore = [
    "PLC0415", # import-outside-top-level
    "PLR", # pylint refactor
    "PLW0717", # too-many-statements-in-try-clause — broad try/except at route boundaries is intentional
    "E501", # line-too-long (handled by formatter)
    "PLW1514", # unspecified-encoding in open(...) function
]
lint.unfixable = ["F401"] # unused-import — report only, do not remove on fix
target-version = "py312"
[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"] # assert is standard in pytest
[tool.ruff.lint.flake8-builtins]
ignorelist = ["id"]
[tool.ruff.lint.flake8-import-conventions]
banned-from = ["datetime", "time"]
[tool.ruff.lint.flake8-import-conventions.aliases]
datetime = "dtm"
time = "tm"
